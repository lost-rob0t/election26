name: Isolated Linux browser fixture
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-isolation:
    # Ubuntu 22.04 supports rootless namespaces without weakening AppArmor/sysctl.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install official renderer dependencies
        run: |
          python -m pip install '.[browser]' 'meson==1.9.1' ninja
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y libcap-dev pkg-config
      - name: Build security-fixed official bubblewrap, unprivileged
        run: |
          git clone --no-checkout https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          git -C "$RUNNER_TEMP/bubblewrap" checkout --detach 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup "$RUNNER_TEMP/bwrap-build" "$RUNNER_TEMP/bubblewrap" --prefix="$RUNNER_TEMP/bwrap-install" -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bwrap-build"
          meson install -C "$RUNNER_TEMP/bwrap-build"
          echo "$RUNNER_TEMP/bwrap-install/bin" >> "$GITHUB_PATH"
      - name: Build dedicated public runtime closure
        run: python scripts/build-browser-runtime.py "$RUNNER_TEMP/election26-browser-runtime"
      - name: Require real isolation and synthetic JavaScript acquisition
        run: |
          # A transient resource-restricted service runs as the ordinary runner.
          # No namespace/security policy is disabled; no privileged container.
          sudo systemd-run --wait --pipe --collect --uid="$(id -u)" \
            -p MemoryMax=1G -p MemorySwapMax=0 -p TasksMax=256 \
            -p RuntimeMaxSec=180 -p KillMode=control-group -p OOMPolicy=continue \
            -p "WorkingDirectory=$GITHUB_WORKSPACE" \
            --setenv="PATH=$PATH" \
            "$(command -v python)" scripts/ci-browser-fixture.py "$RUNNER_TEMP/election26-browser-runtime"
      - name: All offline regression tests
        run: python -m unittest discover -s tests -v
