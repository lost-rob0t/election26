name: Synthetic pipeline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: election26 --archive "$RUNNER_TEMP/election26-status-only" status
      - name: Reject collected data in source control
        run: |
          python - <<'PY'
          import subprocess
          forbidden = {'objects', 'transcripts', 'archives', 'archive', 'data'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          bad = [p for p in tracked if forbidden.intersection(p.split('/')[:-1]) or p.endswith(('.sqlite', '.sqlite3', '.part')) or p.rsplit('/', 1)[-1].startswith('.env')]
          assert not bad, 'Private archive or credential files must not be committed: ' + repr(bad)
          PY
