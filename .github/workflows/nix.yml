name: Nix packages and offline startup
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nix-x86_64-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned public Nix installer
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # verified v31 tag target
        with:
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Require the committed immutable input lock
        run: |
          test -s flake.lock
          nix flake metadata --no-write-lock-file --no-update-lock-file
          git diff --exit-code -- flake.lock
      - name: Verify core, SDK, keyring and source boundary first
        run: |
          nix flake check --no-build --no-write-lock-file
          nix build --no-write-lock-file --print-build-logs --no-link \
            .#checks.x86_64-linux.core .#checks.x86_64-linux.canonical-sdk \
            .#checks.x86_64-linux.keyring .#checks.x86_64-linux.source-boundary \
            .#checks.x86_64-linux.cpu-torch
      - name: Build all optional packages and remaining offline checks
        run: |
          nix flake check --no-write-lock-file --print-build-logs
          nix build --no-write-lock-file --print-build-logs --no-link \
            .#election26 .#election26-starintel .#election26-keyring \
            .#election26-whisper .#election26-full .#cron .#fec-target \
            .#starintel-doc .#keyring .#whisper .#torch-cpu .#yt-dlp .#ffmpeg .#media-tools
      - name: Check development shells and app entrypoints
        run: |
          nix develop --no-write-lock-file --command python -c 'import election26'
          nix develop .#full --no-write-lock-file --command python -c 'import election26, starintel_doc, keyring, whisper'
          nix run --no-write-lock-file .#election26 -- --help
          nix run --no-write-lock-file .#cron -- --help
          nix run --no-write-lock-file .#fec-target -- --help
          git diff --exit-code -- flake.lock
